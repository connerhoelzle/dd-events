name: Update Downtown Dallas Events

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run scraper and build ics
        run: |
          uv run dd-events
          uv run dd-events-ics

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dd_events.json docs/dd_events.ics
          git diff --staged --quiet || git commit -m "Update events data"
          git push
